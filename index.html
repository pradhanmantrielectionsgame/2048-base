<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#edc22e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="2048 with a base you pick, from 2 to 10.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>N048</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --label:#8e8e93;
    --accent:#007aff; --board:#bbada0; --cell:rgba(238,228,218,.35);
    --radius:14px; --g:8px; --p:8px; --cs:70px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#000; --card:#1c1c1e; --text:#fff; --label:#98989f; --board:#3a3a3c; --cell:rgba(255,255,255,.06); }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
    overscroll-behavior:none; touch-action:manipulation; user-select:none;
  }
  .wrap{width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px}
  .row{display:flex; gap:8px; align-items:center}
  h1{font-size:26px; font-weight:700; letter-spacing:-.5px; margin:0; flex:1}
  h1 small{display:block; font-size:11px; font-weight:600; color:var(--label);
           text-transform:uppercase; letter-spacing:.6px}
  .card{background:var(--card); border-radius:var(--radius); padding:6px 12px; min-width:78px; text-align:center}
  .card b{display:block; font-size:20px; font-weight:700; font-variant-numeric:tabular-nums}
  .card small{color:var(--label); font-size:10px; text-transform:uppercase; letter-spacing:.6px}
  button{font:inherit; color:var(--text); background:var(--card); border:0;
         border-radius:var(--radius); padding:12px 16px; font-weight:600; cursor:pointer}
  button:active{opacity:.6}
  .bases{display:flex; gap:6px}
  .bases button{flex:1; padding:9px 0; font-size:16px; border-radius:12px}
  .bases button[aria-pressed=true], #frac[aria-pressed=true]{background:var(--accent); color:#fff}
  #board{position:relative; width:100%; aspect-ratio:1; background:var(--board);
         border-radius:16px; padding:var(--p)}
  .cell,.tile{position:absolute; width:var(--cs); height:var(--cs); border-radius:10px}
  .cell{background:var(--cell)}
  .tile{display:flex; align-items:center; justify-content:center; font-weight:700;
        font-variant-numeric:tabular-nums; letter-spacing:-.5px;
        transition:transform .1s ease-in-out; will-change:transform}
  .pop{animation:pop .16s ease}
  .new{animation:appear .16s ease}
  @keyframes pop{50%{transform:var(--t) scale(1.16)}}
  @keyframes appear{from{transform:var(--t) scale(.2)}}
  #msg{position:absolute; inset:0; display:none; flex-direction:column; gap:14px;
       align-items:center; justify-content:center; background:rgba(238,228,218,.78);
       border-radius:16px; color:#776e65; font-size:30px; font-weight:700; z-index:5}
  #msg.show{display:flex}
  #msg button{background:#8f7a66; color:#fff}
  .hint{color:var(--label); font-size:13px; text-align:center; margin:2px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <h1><span id="goal">2,048</span><small>reach this tile</small></h1>
    <div class="card"><small>Score</small><b id="score">0</b></div>
    <div class="card"><small>Best</small><b id="best">0</b></div>
  </div>
  <div class="bases" id="bases"></div>
  <div id="board"><div id="msg"><div id="msgtext"></div><button id="again">Try again</button></div></div>
  <div class="row">
    <button id="new" style="flex:1">New Game</button>
    <button id="frac" aria-label="Show tiles as fractions">⅟</button>
    <button id="share">Share</button>
    <button id="sound" aria-label="Sound">🔊</button>
  </div>
  <p class="hint">Swipe (or use arrow keys) to move. Two matching tiles merge into one <b id="hintbase">2</b>× bigger.</p>
</div>
<script type="module" src="./src/game.mjs"></script>
</body>
</html>
